# Netlify is retired: Cloudflare Pages (project faro-demos) publishes sitios/ now.
# The old Netlify site stays up only so links already sent keep working:
#   demos-webs.netlify.app/<path>  ->  faro-demos.pages.dev/<path>  (301)
# Deploy previews (deploy-preview-N--demos-webs.netlify.app) are not redirected.
[build]
  publish = "sitios"
  command = ""

[[redirects]]
  from = "https://demos-webs.netlify.app/*"
  to = "https://faro-demos.pages.dev/:splat"
  status = 301
  force = true
