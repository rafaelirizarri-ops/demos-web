<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: #F5F4F0; }
      #root { position: relative; width: 100%; height: 100%; }
      #out { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <!--
      CONPAV hero intro: the logo's globe joins, turns three times on its axis and stops face on,
      then CONPAV comes up under it. Source: src/intro.js, bundled to intro.bundle.js. 5.2 s, plays once.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.2" data-width="1440" data-height="1080">
      <canvas id="out" class="clip" data-start="0" data-duration="5.2" data-track-index="0" width="1440" height="1080"></canvas>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 5.2 }, 0);
      window.__timelines["main"] = tl;
    </script>
    <script src="intro.bundle.js"></script>
  </body>
</html>
