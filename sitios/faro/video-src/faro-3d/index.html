<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #221913; }
      #root { position: relative; width: 100%; height: 100%; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <!--
      Faro hero loop (landscape): a 3D lighthouse at golden hour, rendered with Three.js.
      Source: src/scene.js, bundled to scene.bundle.js with esbuild. Seamless 12 s loop.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080" data-shot="land" data-light="dusk">
      <canvas id="gl" class="clip" data-start="0" data-duration="12" data-track-index="0" width="1920" height="1080"></canvas>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 12 }, 0);
      window.__timelines["main"] = tl;
    </script>
    <script src="scene.bundle.js"></script>
  </body>
</html>
